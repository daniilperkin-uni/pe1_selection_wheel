name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install xvfb for headless Swing tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run tests
        run: |
          chmod +x mvnw
          xvfb-run -a ./mvnw clean test
